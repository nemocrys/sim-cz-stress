# setup for Elmer simulation / solvers

3D_steady:
  Max Output Level: 4
  Coordinate System: Cartesian
  Simulation Type: Steady
  Steady State Max Iterations: 10

HeatSolver:
  Equation: 'Heat Equation'
  Procedure: '"HeatSolve" "HeatSolver"'
  Variable: '"Temperature"'
  Variable Dofs: 1
  Calculate Loads: True
  Exec Solver: Always # diff
  Nonlinear System Convergence Tolerance: 1.0e-5
  Nonlinear System Max Iterations: 1000
  Nonlinear System Relaxation Factor: 0.7
  Steady State Convergence Tolerance: 1.0e-6
  Stabilize: True  # Necessary in convection-dominated systems (models manual p.17) --> decreases simulation duration
  Optimize Bandwidth: True
  Linear System Solver: Iterative  
  Linear System Iterative Method: BiCGStab
  Linear System Max Iterations: 10000
  Linear System Preconditioning: ILU
  Linear System Precondition Recompute: 1
  Linear System Convergence Tolerance: 1.0e-09
  Linear System Abort Not Converged: True
  Linear System Residual Output: 1

ResultOutputSolver:
  Exec Solver: 'After timestep'
  Equation: '"ResultOutput"'
  Procedure: '"ResultOutputSolve" "ResultOutputSolver"'
  VTU Format: True
  Save Geometry Ids: 'Logical True'
  Ascii Output : 'Logical True'
  Show Variables : 'Logical True'
  # Scalar Field 1: '"Temperature"'


StressSolver:
  Exec Solver : Always
  Equation : Linear elasticity
  Procedure : '"StressSolve" "StressSolver"'
  Variable : '"Displacement"'
  Variable DOFs : Integer 3
  #! hierarchial p-element base (alternative for higher-order)
  #Element : p:3

  Displace Mesh : Logical False
  Calculate Stresses : Logical True
  Calculate Strains : Logical True

  Linear System Solver : Iterative
  Linear System Symmetric : Logical True
  Linear System Scaling : Logical False
  Linear System Iterative Method : BiCGStab
  Linear System Direct Method : UMFPACK
  Linear System Convergence Tolerance : 1.0e-8
  Linear System Max Iterations : 10000
  Linear System Preconditioning : ILU

  Nonlinear System Convergence Tolerance : Real 1.0e-8
  Nonlinear System Max Iterations : Integer 3
  Nonlinear System Relaxation Factor : Real 1

  Steady State Convergence Tolerance: 1.0e-7
  Optimize Bandwidth : True

FluxSolver:
  Exec Solver: 'After timestep'
  Procedure: '"FluxSolver" "FluxSolver"'
  Equation: "Flux Solver"
  Target Variable: String "Temperature"
  Calculate Grad: Logical True
  Linear System Convergence Tolerance: 1.0e-09
  Linear System Iterative Method: '"BiCGStab"'
  Linear System Max Iterations: 500
  Linear System Preconditioning: ILU
  Linear System Residual Output: 0
  Linear System Solver: '"Iterative"'

save_line_solver_axial:  
  Exec Solver: 'After timestep'
  Equation: '"SaveLine"'
  Procedure: '"SaveData" "SaveLine"'
  Filename: '"axial.dat"'
  Output Directory: './results'
  Variable 1: temperature
  Variable 2: vonmises
  Variable 3 : temperature grad 
  Exact Coordinates : True
  Polyline Divisions(1,3) : 100

save_line_solver_radial:  
  Exec Solver: 'After timestep'
  Equation: '"SaveLine"'
  Procedure: '"SaveData" "SaveLine"'
  Filename: '"radial.dat"'
  Output Directory: './results'
  Variable 1: temperature
  Variable 2: vonmises
  Variable 3 : temperature grad 
  Exact Coordinates : True
  Polyline Divisions(1,3) : 100

save_scalars:
  Exec Solver: 'after saving'
  Equation: SaveScalars
  Procedure: '"SaveData" "SaveScalars"'
  Filename: '"scalars.dat"'
  Output Directory: './results'

  
  Variable 1: temperature
  Operator 1: body min
  Mask Name 1: crystal 

  Variable 2: temperature
  Operator 2: body max
  Mask Name 2: crystal  


  Variable 3: vonmises
  Operator 3: body max
  Mask Name 3: crystal 

